    Projects:
      - name: Magnetized Collisionless Shocks in WarpX
        url: https://github.com/HasanHelal429/KinShock2020
        highlights:
          - "Reproduced and verified the piston-driven magnetized shocks of Schaeffer et al. (2020) in the particle-in-cell code WarpX (KinShock2020)"
          - "Ported a ray-traced laser-deposition module (after Hyder et al. 2024) to drive shocks from a modeled laser rather than a prescribed piston (LaserProdShock)"
          - Extended the shock-driver operators to WarpX's hybrid kinetic-ion/fluid-electron solver, cutting simulation cost by over three orders of magnitude versus explicit PIC (H-PICShock)

      - name: Synthetic Thomson Spectra from PIC Simulations
        url: https://github.com/Schaeffer-Lab/Schaeffer_PlasmaPy
        summary: "Tools: Python, OSIRIS, WarpX"
        highlights:
          - Built a forward-model pipeline that takes output from a general PIC simulation and generates Thomson spectra
          - Generalized the pipeline to both OSIRIS and WarpX

      - name: Machine Learning for Thomson-Scattering Diagnostics
        url: https://github.com/kkkkkehan666/TLforTS
        summary: "Tools: Python, PyTorch"
        highlights:
          - Built a dense neural network to infer plasma parameters from Thomson-scattering spectra
          - Compared the efficacy of transfer learning against traditional fitting methods

      - name: Computational Physics Simulations
        url: https://github.com/HasanHelal429/Physics-Simulation
        summary: "Tools: Python, NumPy, SciPy"
        highlights:
          - Python and Jupyter simulations across classical mechanics, electromagnetism, fluid dynamics, thermodynamics, and quantum mechanics
          - "n-body orbital dynamics: specific solutions to the n-body problem and Barnes-Hut galaxy simulation"
          - Self-consistent atomic and molecular density-functional-theory (Hartree-Fock / Kohn-Sham LDA) solver

      - name: General-Relativistic Raytracing
        url: https://github.com/HasanHelal429/General_Relativity
        summary: "Tools: Python"
        highlights:
          - Raytracer through Schwarzschild spacetime rendering gravitational lensing, the photon sphere, the black-hole shadow, and a lensed accretion disk
          - Extending toward Kerr (rotating) spacetimes and gravitational-wave inspiral modeling

      - name: OpenGL Physics
        summary: "Tools: C++, OpenGL, CMake"
        highlights:
          - Interactive C++/OpenGL physics simulators sharing a fixed-timestep framework (GLFW, glad, Dear ImGui)
          - "Live atomic Hartree-Fock / Kohn-Sham LDA SCF solver, N-body gravity, and 3D Lennard-Jones molecular dynamics"

      - name: Quantum Mechanics Substack
        url: https://hasanhelal.substack.com/
        summary: A visual introduction to the Schrödinger equation
        highlights:
          - Use simulation and analogy to explain the core equation of quantum mechanics to a lay audience
          - Developed the physics simulator behind the quantum-mechanical visualizations

